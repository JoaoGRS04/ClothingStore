<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <h1 class="title">Loja</h1>
    <div class="layout">
      <main class="catalog">
        <h2>Produtos:</h2>
        <label for="category-filter">Categoria:</label>
        <select id="category-filter">
          <option value="all">Todas</option>
          <option value="shirt">Camisetas</option>
          <option value="pants">Calças</option>
          <option value="jacket">Jaquetas</option>
          <option value="shoes">Calçados</option>
        </select>
        <label for="max-price">Preço máximo (R$):</label>
        <input type="number" id="max-price" min="0" step="10" placeholder="Ex: 100" />
        <ul id="product-list"></ul>
        <section id="product-details"></section>
        <section>
      </main>
      <aside class="cart">
        <h2>Carrinho</h2>
        <ul id="cart-list"></ul>
        <button id="clear">Esvaziar carrinho</button>
        <p id="cart-total"></p>
        </section>
      </aside>
      <aside class="wallet">
        <h2>Saldo</h2>
        <p id="wallet-balance"></p>
        <label for="balance-input">Valor (R$):</label>
        <input type="number" id="balance-input" min="0" step="10" placeholder="Ex: 50" />
        <button id="add-balance">Adicionar</button>
        <button id="withdraw-balance">Remover</button>
        <button id="reset-balance">Zerar</button>
        <p id="wallet-message"></p>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
